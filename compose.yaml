name: anima-lora-factory

services:
  dataset-downloader:
    profiles: ["tools"]
    image: anima-danbooru-dataset-downloader:latest
    build:
      context: ./tools/danbooru-dataset-downloader
    environment:
      DANBOORU_USERNAME: ${DANBOORU_USERNAME:-}
      DANBOORU_API_KEY: ${DANBOORU_API_KEY:-}
      DANBOORU_USER_AGENT: ${DANBOORU_USER_AGENT:-anima-lora-factory-dataset-downloader/1.0}
    volumes:
      - "${DATASETS_DIR:-./data/datasets}:/datasets"
  app:
    image: anima-lora-factory:cuda12.8
    build:
      context: .
      args:
        PYTORCH_IMAGE: pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime
        UPSTREAM_ARCHIVE: Anima-LoRA-Factory-v6.0.zip
    gpus: all
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_PORT: "8000"
      APP_HOST: "0.0.0.0"
      ANIMA_DOCKER: "1"
      DATASETS_ROOT: /workspace/datasets
      MODELS_ROOT: /workspace/models
      OUTPUT_ROOT: /workspace/output
      MIXED_PRECISION: ${MIXED_PRECISION:-auto}
      HF_HOME: /workspace/huggingface
      HUGGINGFACE_HUB_CACHE: /workspace/huggingface/hub
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    volumes:
      - "${DATASETS_DIR:-./data/datasets}:/workspace/datasets"
      - "${MODELS_DIR:-./data/models}:/workspace/models:ro"
      - "${OUTPUT_DIR:-./data/output}:/workspace/output"
      - "${HF_CACHE_DIR:-./data/huggingface}:/workspace/huggingface"
    shm_size: "8gb"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

